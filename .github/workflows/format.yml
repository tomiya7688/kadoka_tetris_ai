name: Changed source formatting

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Bootstrap and audit Python CA bundles
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes -r requirements-security.txt
          python tools/audit_python_trust.py
      - run: python -m pip install --disable-pip-version-check -r requirements-ci.txt
      - name: Check changed Python and C++ sources without writing
        env:
          FORMAT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          FORMAT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python tools/format_code.py --check --base "$FORMAT_BASE" --head "$FORMAT_HEAD"
