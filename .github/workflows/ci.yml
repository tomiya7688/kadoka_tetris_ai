name: Core + Python CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: core-python-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpp-reachability:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      LC_ALL: C

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check Clang version
        run: clang++-18 --version

      - name: Verify unreachable code causes a compilation failure
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/unreachable-probe.cpp" <<'EOF'
          int probe() {
              return 1;
              return 2;
          }
          EOF
          if clang++-18 -std=c++20 -Wunreachable-code-aggressive -Werror=unreachable-code -Werror=unreachable-code-aggressive -fsyntax-only "$RUNNER_TEMP/unreachable-probe.cpp" 2> "$RUNNER_TEMP/unreachable-probe.log"; then
            echo "The intentional unreachable statement was not rejected."
            exit 1
          fi
          if ! grep -Eq 'error:.*\[-Werror,-Wunreachable-code' "$RUNNER_TEMP/unreachable-probe.log"; then
            cat "$RUNNER_TEMP/unreachable-probe.log"
            echo "The compiler failed for a reason other than unreachable code."
            exit 1
          fi

      - name: Verify and scan C++ headers for unreachable code
        shell: bash
        run: |
          flags=(-std=c++20 -DNDEBUG -Wunreachable-code-aggressive -Werror=unreachable-code -Werror=unreachable-code-aggressive -Icore/include -Iruntime/include -x c++ -fsyntax-only)
          cat > "$RUNNER_TEMP/unreachable-probe.hpp" <<'EOF'
          inline int header_probe() {
              return 1;
              return 2;
          }
          EOF
          for macro in '' '-DKADOKA_TETRIS_C_API_BUILD'; do
            if clang++-18 "${flags[@]}" ${macro:+"$macro"} "$RUNNER_TEMP/unreachable-probe.hpp" 2> "$RUNNER_TEMP/header-probe.log"; then
              echo "The intentional unreachable header statement was not rejected."
              exit 1
            fi
            if ! grep -Eq 'error:.*\[-Werror,-Wunreachable-code' "$RUNNER_TEMP/header-probe.log"; then
              cat "$RUNNER_TEMP/header-probe.log"
              echo "The header probe failed for a reason other than unreachable code."
              exit 1
            fi
          done
          git ls-files -z -- '*.h' '*.hpp' > "$RUNNER_TEMP/tracked-headers"
          mapfile -d '' -t headers < "$RUNNER_TEMP/tracked-headers"
          if ((${#headers[@]} == 0)); then
            echo "No tracked C++ headers found."
            exit 1
          fi
          for header in "${headers[@]}"; do
            echo "Checking $header"
            clang++-18 "${flags[@]}" "$header"
            clang++-18 "${flags[@]}" -DKADOKA_TETRIS_C_API_BUILD "$header"
          done
          echo "Checked ${#headers[@]} tracked headers in both C API configurations."

      - name: Configure C++ reachability build
        run: >-
          cmake -S . -B build-cpp-reachability -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=ON -DCMAKE_CXX_COMPILER=clang++-18
          -DCMAKE_CXX_FLAGS="-Wunreachable-code-aggressive -Werror=unreachable-code -Werror=unreachable-code-aggressive"

      - name: Verify reachability flags for every C++ source
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import shlex
          import subprocess

          tracked = subprocess.check_output(["git", "ls-files", "-z", "--", "*.cpp"])
          expected = {Path(os.fsdecode(path)).resolve() for path in tracked.split(b"\0") if path}
          commands = json.loads(Path("build-cpp-reachability/compile_commands.json").read_text(encoding="utf-8"))
          actual = {Path(command["file"]).resolve() for command in commands}
          if not expected or expected != actual:
              raise SystemExit(f"C++ compile database mismatch: missing={sorted(expected - actual)}, unexpected={sorted(actual - expected)}")
          required = {"-Wunreachable-code-aggressive", "-Werror=unreachable-code", "-Werror=unreachable-code-aggressive"}
          for command in commands:
              flags = shlex.split(command["command"])
              if not required.issubset(flags) or any(
                  flag in ("-w", "-Wno-error", "-Wno-everything") or flag.startswith(("-Wno-unreachable-code", "-Wno-error=unreachable-code"))
                  for flag in flags
              ):
                  raise SystemExit(f"Missing or disabled reachability flags: {command['file']}")
          print(f"Verified reachability flags for {len(expected)} C++ sources.")
          PY

      - name: Build C++ targets with reachability checks
        run: cmake --build build-cpp-reachability --config Release --parallel 2 --verbose

      - name: Test C++ targets
        run: ctest --test-dir build-cpp-reachability -C Release --output-on-failure

  cpp-memory-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      LSAN_OPTIONS: exitcode=23:report_objects=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure C++ sanitizers
        run: >-
          cmake -S . -B build-cpp-sanitized -DCMAKE_BUILD_TYPE=Debug
          -DBUILD_TESTING=ON -DKADOKA_ENABLE_SANITIZERS=ON

      - name: Build sanitized C++ targets
        run: cmake --build build-cpp-sanitized --config Debug --parallel 2

      - name: Run sanitized C++ tests with leak detection
        run: ctest --test-dir build-cpp-sanitized -C Debug --output-on-failure

      - name: Verify an unfreed allocation fails the leak check
        shell: bash
        run: |
          cat > leak_probe.cpp <<'EOF'
          void leak() {
              int* leaked = new int[8]();
              leaked[0] = 17;
              (void)leaked[0];
          }
          int main() {
              leak();
              return 0;
          }
          EOF
          c++ -g -fsanitize=address,undefined -fno-omit-frame-pointer leak_probe.cpp -o leak_probe
          set +e
          ./leak_probe > leak_probe.log 2>&1
          status=$?
          set -e
          if [ "$status" -ne 23 ] || ! grep -q "LeakSanitizer: detected memory leaks" leak_probe.log; then
            cat leak_probe.log
            echo "LeakSanitizer did not fail on the intentional leak."
            exit 1
          fi

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: ${{ github.workspace }}/src
      KADOKA_TETRIS_BRIDGE: ${{ github.workspace }}/build-cpp/libkadoka_tetris_bridge.so
      KADOKA_TETRIS_NATIVE_BENCHMARK: ${{ github.workspace }}/build-cpp/kadoka_tetris_runtime_benchmark

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-ci.txt
            requirements-security.txt

      - name: Remove blocked CA roots from hosted runner
        shell: bash
        run: |
          if [ -n "${SSL_CERT_FILE:-}" ] || [ -n "${SSL_CERT_DIR:-}" ]; then
            echo "Custom OpenSSL CA paths require manual review" >&2
            exit 1
          fi
          sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT "$(command -v python)" -B tools/ci_remediate_trust.py

      - name: Bootstrap and audit Python CA bundles
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes -r requirements-security.txt
          python tools/audit_python_trust.py

      - name: Install lint and format tools
        run: python -m pip install --disable-pip-version-check -r requirements-ci.txt

      - name: Check architecture boundaries
        run: python tools/kadoka_rule_checker.py .

      - name: Validate family model metadata
        run: python tools/family_metadata/script/validate_metadata.py --game tetris models/examples/family_metadata.json

      - name: Configure C++ core
        run: cmake -S . -B build-cpp -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON

      - name: Build C++ core
        run: cmake --build build-cpp --config Release --parallel 2

      - name: Test C++ core
        run: ctest --test-dir build-cpp -C Release --output-on-failure

      - name: Compile Python sources
        run: python -m compileall -q src tests tools

      - name: Run correctness lint
        run: python -m ruff check --output-format=github src tests tools

      - name: Check Python unreachable code
        run: python -m pyright

      - name: Run Python unit tests
        run: python -m unittest discover -s tests -v
