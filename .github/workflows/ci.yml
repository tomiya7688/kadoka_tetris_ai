name: Python CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: python-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: ${{ github.workspace }}/src

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install CI tools
        run: python -m pip install --disable-pip-version-check -r requirements-ci.txt

      - name: Check architecture boundaries
        run: python tools/kadoka_rule_checker.py .

      - name: Validate family model metadata
        run: python tools/family_metadata/script/validate_metadata.py --game tetris models/examples/family_metadata.json

      - name: Compile Python sources
        run: python -m compileall -q src tests tools

      - name: Run correctness lint
        run: python -m ruff check --output-format=github src tests tools

      - name: Run unit tests
        run: python -m unittest discover -s tests -v
