name: Windows distribution build

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: windows-distribution-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Build and smoke-test distribution
        shell: cmd
        run: build.bat

      - name: Upload portable distribution
        uses: actions/upload-artifact@v4
        with:
          name: KadokaTetrisAI-windows
          path: dist/KadokaTetrisAI/
          if-no-files-found: error
          retention-days: 14
