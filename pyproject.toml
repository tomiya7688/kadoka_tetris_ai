[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# Start CI with correctness-focused rules only. The existing codebase is not yet
# fully normalized for style, so formatting/style rules should be enabled after
# a dedicated cleanup instead of blocking unrelated feature work.
select = ["E9", "F63", "F7", "F82"]

[tool.pyright]
include = ["src", "tests", "tools"]
pythonVersion = "3.11"
typeCheckingMode = "off"
enableReachabilityAnalysis = true
reportUnreachable = "error"
reportMissingImports = "none"
